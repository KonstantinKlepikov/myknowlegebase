<!DOCTYPE html>
<html lang="{{ site.lang | default: "ru-RU" }}">

  {% include head.html %}

  <body>

    {% include header.html %}

    <main role="main">

      {{ content }}

    </main>

    {% include footer.html %}

  </body>

</html>

<script type="text/javascript">
  // Hack: Replace page-link with "Page Title"
  document.querySelectorAll(".markdown-body a[title]").forEach((a) => {
    a.innerText = a.title;
  });
  // Hack: Remove .md extension from wikilinks to get the html in jekyll
  document.querySelectorAll("a").forEach(l => {
    if (l.href.endsWith('.md')) {
      l.href = l.href.substring(0, l.href.length-3)
    }
  });
  // Fix Foam relative wiki links broken by permalink:pretty.
  // With pretty permalinks notes/abc.md is served at /notes/abc/ (one URL
  // level deeper than the filesystem). Foam generates relative paths based
  // on the filesystem, so ../notes/slug and bare slug hrefs resolve one
  // level too deep in the browser. We correct them to absolute URLs here.
  (function() {
    var baseurl = '{{ site.baseurl }}';
    var path = window.location.pathname;
    // Only run on pages one level deeper than expected:
    // /baseurl/notes/<slug>/ or /baseurl/lists/<slug>/
    var re = new RegExp('^' + baseurl.replace(/\//g, '\\/') + '\\/(notes|lists)\\/[^\\/]+\\/$');
    var m = path.match(re);
    if (!m) return;
    var dir = m[1]; // 'notes' or 'lists'

    document.querySelectorAll('a').forEach(function(l) {
      var attr = l.getAttribute('href');
      if (!attr || /^(https?:|\/|#|mailto:)/.test(attr)) return;

      if (attr.startsWith('../')) {
        // Cross-directory Foam link: ../notes/slug or ../lists/slug
        // Strip ../ and make absolute from site root
        l.href = baseurl + '/' + attr.slice(3) + '/';
      } else if (attr.indexOf('/') === -1) {
        // Same-directory Foam link: bare slug (no path separator)
        l.href = baseurl + '/' + dir + '/' + attr + '/';
      }
    });
  })();
</script>
