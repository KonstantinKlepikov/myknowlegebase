---
layout: default
---
<article class="container mx-auto px-2 mt2 mb4">
  <header>
    <h1 class="h1 col-9 sm-width-full py-4 mt-3 inline-block" itemprop="name headline">{{ page.title }}</h1>
    <a class="h5 link-primary ml-2" href="{{ site.baseurl }}{{ page.parent_url }}">← Rendered</a>
  </header>
  <div class="prose mb-4 py-4">
    <p class="h5">markdown source:</p>
    <pre style="white-space: pre-wrap; word-break: break-word; overflow-x: auto;"><code>{{ content | xml_escape }}</code></pre>
  </div>
</article>
